<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0D1B2E"/>
      <stop offset="100%" stop-color="#050B18"/>
    </radialGradient>

    <!-- C-shape linear gradient (top-left to bottom-right) -->
    <linearGradient id="cGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#5DEEFF"/>
      <stop offset="40%" stop-color="#00D4FF"/>
      <stop offset="75%" stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#066A8C"/>
    </linearGradient>

    <!-- Eye radial gradient -->
    <radialGradient id="eyeGradient" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7FECFF"/>
      <stop offset="45%" stop-color="#33D9FF"/>
      <stop offset="85%" stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#066A8C"/>
    </radialGradient>

    <!-- Glow filter for C -->
    <filter id="cGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for eye -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for brackets -->
    <filter id="bracketGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Outer subtle glow ring -->
  <circle cx="256" cy="240" r="200" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.08"/>

  <!-- C-shape: thick annular arc opening at bottom-right (~280°) -->
  <!-- Using path with arc commands for precise C shape -->
  <g filter="url(#cGlow)">
    <path d="
      M 370 130
      A 150 150 0 1 0 370 350
      L 340 310
      A 100 100 0 1 1 340 170
      Z
    " fill="url(#cGradient)" stroke="#5DEEFF" stroke-width="2" stroke-linejoin="round"/>

    <!-- Inner depth shadow on C -->
    <path d="
      M 370 130
      A 150 150 0 1 0 370 350
      L 355 325
      A 125 125 0 1 1 355 155
      Z
    " fill="none" stroke="#066A8C" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Eye: glowing sphere in center of C -->
  <g filter="url(#eyeGlow)">
    <!-- Outer glow halo -->
    <circle cx="256" cy="240" r="75" fill="#00D4FF" opacity="0.15"/>
    <!-- Eye sphere -->
    <circle cx="256" cy="240" r="55" fill="url(#eyeGradient)"/>
    <!-- Eye highlight (upper-right) -->
    <circle cx="272" cy="224" r="12" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="272" cy="224" r="6" fill="#FFFFFF"/>
    <!-- Subtle eye rim -->
    <circle cx="256" cy="240" r="55" fill="none" stroke="#5DEEFF" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Code brackets badge at bottom -->
  <g filter="url(#bracketGlow)">
    <!-- Badge background (rounded pill) -->
    <rect x="196" y="370" width="120" height="56" rx="20" fill="#0F1E33" stroke="#00D4FF" stroke-width="1.5" opacity="0.95"/>
    <!-- </> symbol -->
    <text x="256" y="406" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00E5FF" letter-spacing="1">&lt;/&gt;</text>
  </g>

  <!-- Subtle bottom reflection -->
  <ellipse cx="256" cy="460" rx="120" ry="8" fill="#00D4FF" opacity="0.06"/>
</svg>