<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark indigo background -->
  <rect width="512" height="512" rx="96" fill="#0A0A1F"/>
  
  <!-- C shape = monster body (thick geometric C) -->
  <path d="M 360 140 
           A 130 130 0 1 0 360 372
           L 360 318
           A 76 76 0 1 1 360 194
           Z" 
        fill="#1E293B" stroke="#06B6D4" stroke-width="6"/>
  
  <!-- Single large eye in center of C -->
  <circle cx="256" cy="256" r="72" fill="#0F172A" stroke="#06B6D4" stroke-width="4"/>
  <circle cx="256" cy="256" r="52" fill="#22D3EE"/>
  <circle cx="256" cy="256" r="28" fill="#0A0A1F"/>
  <circle cx="268" cy="244" r="10" fill="#67E8F9" opacity="0.9"/>
  
  <!-- Code bracket fangs at bottom of C -->
  <text x="220" y="380" font-family="monospace" font-size="48" font-weight="bold" fill="#EC4899" opacity="0.9">&lt;/&gt;</text>
  
  <!-- Two small horns on top of C -->
  <path d="M 180 110 L 200 150 L 160 150 Z" fill="#06B6D4"/>
  <path d="M 332 110 L 352 150 L 312 150 Z" fill="#06B6D4"/>
  
  <!-- Neon glow accents -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="72;78;72" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>