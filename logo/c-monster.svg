<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dark background squircle -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#263238"/>

  <!-- The C body - thick green arc, opening on right, centered -->
  <path d="M 120 50 A 55 55 0 1 0 120 150" fill="none" stroke="#80E27E" stroke-width="28" stroke-linecap="round"/>

  <!-- Eye on top end of C -->
  <circle cx="120" cy="50" r="14" fill="#FFFFFF"/>
  <circle cx="125" cy="50" r="7" fill="#263238"/>
  <circle cx="127" cy="48" r="2.5" fill="#FFFFFF"/>

  <!-- Code morsels floating into the C opening -->
  <rect x="140" y="90" width="18" height="8" rx="4" fill="#29B6F6"/>
  <circle cx="136" cy="100" r="5" fill="#FFEA00"/>
  <rect x="142" y="105" width="20" height="8" rx="4" fill="#29B6F6"/>
</svg>